name: VertexSkinBridge (mod build)

on:
  push:
    paths:
      - 'skin-bridge/**'
      - '.github/workflows/skin-bridge.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skin-bridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build mod jar
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: vertexskinbridge
          path: skin-bridge/build/libs/vertexskinbridge-*.jar
